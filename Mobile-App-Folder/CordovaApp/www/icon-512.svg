<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Coolplay's Games And More</title>
  <desc id="desc">A galaxy blue logo with white stacked text reading Coolplay's, Games, and And More.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#031a4d"/>
      <stop offset="50%" stop-color="#0a3d91"/>
      <stop offset="100%" stop-color="#1578d4"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#7cc7ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7cc7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="75%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6f7bff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6f7bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundClip">
      <rect width="512" height="512" rx="86"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="86" fill="url(#bg)"/>
  <g clip-path="url(#roundClip)">
    <circle cx="150" cy="140" r="170" fill="url(#nebulaA)"/>
    <circle cx="370" cy="330" r="160" fill="url(#nebulaB)"/>
    <g fill="#ffffff" opacity="0.9">
      <circle cx="82" cy="92" r="3"/>
      <circle cx="118" cy="180" r="2.5"/>
      <circle cx="412" cy="110" r="2.5"/>
      <circle cx="438" cy="178" r="3"/>
      <circle cx="390" cy="286" r="2"/>
      <circle cx="98" cy="316" r="2.5"/>
      <circle cx="148" cy="408" r="3"/>
      <circle cx="430" cy="398" r="2.5"/>
    </g>
  </g>
  <g fill="#ffffff" filter="url(#softGlow)" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif">
    <text x="256" y="158" font-size="62" font-weight="700" letter-spacing="1.5">Coolplay's</text>
    <text x="256" y="280" font-size="114" font-weight="800" letter-spacing="2">Games</text>
    <text x="256" y="380" font-size="50" font-weight="700" letter-spacing="4">And More</text>
  </g>
</svg>