<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">Coolplay's Games And More</title>
  <desc id="desc">A galaxy blue logo with white stacked text reading Coolplay's, Games, and And More.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#031a4d"/>
      <stop offset="50%" stop-color="#0a3d91"/>
      <stop offset="100%" stop-color="#1578d4"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="30%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#7cc7ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7cc7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="75%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6f7bff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6f7bff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="roundClip">
      <rect width="192" height="192" rx="32"/>
    </clipPath>
  </defs>
  <rect width="192" height="192" rx="32" fill="url(#bg)"/>
  <g clip-path="url(#roundClip)">
    <circle cx="54" cy="50" r="62" fill="url(#nebulaA)"/>
    <circle cx="144" cy="132" r="56" fill="url(#nebulaB)"/>
    <g fill="#ffffff" opacity="0.9">
      <circle cx="28" cy="35" r="1.4"/>
      <circle cx="41" cy="72" r="1.2"/>
      <circle cx="152" cy="40" r="1.3"/>
      <circle cx="164" cy="72" r="1.4"/>
      <circle cx="36" cy="145" r="1.3"/>
      <circle cx="148" cy="152" r="1.2"/>
    </g>
  </g>
  <g fill="#ffffff" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif">
    <text x="96" y="58" font-size="21" font-weight="700">Coolplay's</text>
    <text x="96" y="106" font-size="39" font-weight="800">Games</text>
    <text x="96" y="143" font-size="17" font-weight="700" letter-spacing="1.4">And More</text>
  </g>
</svg>