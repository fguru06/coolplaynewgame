<html>
    <head>
        <meta charset="utf-8">
        <!--
        Customize this policy to fit your own app's needs. For more guidance, please refer to the docs:
            https://cordova.apache.org/docs/en/latest/
        Some notes:
            * https://ssl.gstatic.com is required only on Android and is needed for TalkBack to function properly
            * Disables use of inline scripts in order to mitigate risk of XSS vulnerabilities. To change this:
                * Enable inline JS: add 'unsafe-inline' to default-src
        -->
        <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: https://ssl.gstatic.com 'unsafe-eval'; style-src 'self' 'unsafe-inline'; media-src *; img-src 'self' data: content:;">
        <meta name="format-detection" content="telephone=no">
        <meta name="msapplication-tap-highlight" content="no">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="css/index.css">
        <title>Hello World</title>
    </head>
    <body>
        <div class="startup-screen" aria-hidden="true">
            <div class="startup-screen__glow"></div>
            <div class="startup-screen__panel">
                <div class="startup-screen__label">Coolplay Mobile</div>
                <div class="startup-screen__core"></div>
                <h2>Launching your arcade</h2>
                <p>Booting the game hub and preparing a smooth app experience.</p>
                <div class="startup-screen__bar"><span></span></div>
            </div>
        </div>
        <div class="app">
            <h1>Games App</h1>
            <div id="main-menu">
                <button onclick="openGame('cookie-clicker')">Cookie Clicker</button>
                <button onclick="openGame('chess-game')">Chess</button>
                <button onclick="openGame('checkers-game')">Checkers</button>
                <button onclick="openGame('drag-game')">Drag Game</button>
                <button onclick="openGame('finish-line')">Finish Line</button>
                <button onclick="openGame('Human_Body_Systems')">Human Body Systems</button>
                <button onclick="openGame('Machines - Copy')">Machines</button>
                <button onclick="openGame('tic-tac-toe-game')">Tic Tac Toe</button>
                <button onclick="openGame('listify')">Listify</button>
                <button onclick="openGame('spinit')">SpinIt</button>
                <button onclick="openGame('platforming')">Platforming</button>
            </div>
            <div id="game-container" style="display:none; width:100vw; height:100vh;">
                <button onclick="closeGame()" style="position:absolute;z-index:2;top:10px;right:10px;">Back to Menu</button>
                <iframe id="game-frame" src="" style="width:100vw;height:100vh;border:none;"></iframe>
            </div>
        </div>
        <script src="cordova.js"></script>
        <script>
        document.body.classList.add('is-loading');

        function finishEntrance() {
            document.body.classList.add('is-ready');
            window.setTimeout(function () {
                document.body.classList.remove('is-loading');
            }, 900);
        }

        if (document.readyState === 'complete') {
            window.setTimeout(finishEntrance, 250);
        } else {
            window.addEventListener('load', function () {
                window.setTimeout(finishEntrance, 250);
            }, { once: true });
        }

        function openGame(game) {
            var gameMap = {
                'cookie-clicker': 'cookie-clicker/index.html',
                'chess-game': 'chess-game/index.html',
                'checkers-game': 'checkers-game/index.html',
                'drag-game': 'drag-game/index.html',
                'finish-line': 'finish-line/index.html',
                'Human_Body_Systems': 'Human_Body_Systems/index.html',
                'Machines - Copy': 'Machines - Copy/index.html',
                'tic-tac-toe-game': 'tic-tac-toe-game/index.html',
                'listify': 'listify/index.html',
                'spinit': 'spinit/index.html',
                'platforming': 'platforming/index.html'
            };
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            document.getElementById('game-frame').src = gameMap[game];
        }
        function closeGame() {
            document.getElementById('game-frame').src = '';
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';
        }
        </script>
    </body>
</html>
