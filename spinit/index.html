<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpinIt — Wheel Spinner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button onclick="window.location.href='../index.html'" class="home-btn">Home</button>

  <div class="app">
    <header>
      <h1>🎡 SpinIt</h1>
      <p class="subtitle">Add your options and give the wheel a spin!</p>
    </header>

    <div class="controls">
      <div class="input-row">
        <input type="text" id="option-input" placeholder="Enter an option..." maxlength="40">
        <button id="add-btn">+ Add</button>
      </div>

      <div class="options-display" id="options-display">
        <p class="empty-msg" id="empty-msg">No options yet. Add some above!</p>
      </div>

      <div class="action-row">
        <button id="spin-btn" disabled>🎡 Spin the Wheel!</button>
        <button id="clear-btn" class="secondary">Clear All</button>
      </div>
      <div class="save-row">
        <button id="save-btn" class="secondary" disabled>💾 Save Wheel</button>
      </div>
      <div class="saved-wheels" id="saved-wheels" hidden>
        <p class="saved-title">Saved Wheels</p>
        <div class="saved-list" id="saved-list"></div>
      </div>
    </div>

    <div class="wheel-section">
      <canvas id="wheel-canvas" width="480" height="480"></canvas>
      <div class="pointer">▼</div>
    </div>

    <!-- Result popup -->
    <div class="result-overlay" id="result" hidden>
      <div class="result-popup">
        <div class="result-sparkle">✨</div>
        <p class="result-label" id="result-label">Option 1</p>
        <p class="result-wins" id="result-wins">Wins!</p>
        <button id="remove-result-btn" class="result-btn">Remove &amp; Spin Again</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
