<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platforming</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="image-selection">
    <button id="mario-button">Select Mario</button>
    <button id="luigi-button">Select Luigi</button>
    <button id="peach-button">Select Peach</button>
    <button onclick="window.location.href='../index.html'">Home</button>
  </div>

  <div id="game-wrapper" style="display:none">
    <div id="hud">
      <span id="level-display">Level 1</span>
      <span id="coin-display">🪙 0</span>
      <span id="lives-display">❤️ 5</span>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="restart-container"></div>
  </div>

  <div id="level-complete" class="overlay" hidden>
    <div class="overlay-box">
      <h2>🎉 Level Complete!</h2>
      <p id="complete-stats"></p>
      <button id="next-level-btn" class="overlay-btn">Next Level</button>
    </div>
  </div>

  <div id="game-won" class="overlay" hidden>
    <div class="overlay-box">
      <h2>🏆 You Win!</h2>
      <p id="win-stats"></p>
      <button id="play-again-btn" class="overlay-btn">Play Again</button>
    </div>
  </div>

  <div id="death-screen" class="overlay" hidden>
    <div class="overlay-box">
      <h2>💀 Game Over</h2>
      <p>You died! 5 lives left.</p>
      <button id="retry-btn" class="overlay-btn">Retry</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
