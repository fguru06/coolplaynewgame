  <g fill="#ffffff" text-anchor="middle" font-family="Trebuchet MS, Segoe UI, Arial, sans-serif">
    <text x="85" y="58" font-size="23" font-weight="700">Coolplay's</text>
    <text x="85" y="108" font-size="42" font-weight="800">Games</text>
    <text x="85" y="146" font-size="18" font-weight="700" letter-spacing="1.2">And More</text>
