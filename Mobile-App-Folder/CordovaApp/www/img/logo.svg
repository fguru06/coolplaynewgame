<svg xmlns="http://www.w3.org/2000/svg" width="170" height="200" viewBox="0 0 170 200" role="img" aria-labelledby="title desc">
  <title id="title">Coolplay's Games And More</title>
  <desc id="desc">A galaxy blue mobile logo with white stacked text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#04153e"/>
      <stop offset="55%" stop-color="#0b3f8d"/>
      <stop offset="100%" stop-color="#178be2"/>
    </linearGradient>
    <radialGradient id="mistA" cx="28%" cy="24%" r="56%">
      <stop offset="0%" stop-color="#94ddff" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#94ddff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistB" cx="74%" cy="74%" r="44%">
      <stop offset="0%" stop-color="#9a89ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9a89ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="170" height="200" rx="26" fill="url(#bg)"/>
  <circle cx="44" cy="48" r="54" fill="url(#mistA)"/>
  <circle cx="126" cy="144" r="46" fill="url(#mistB)"/>
  <g fill="#ffffff" opacity="0.9">
